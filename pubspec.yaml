name: grow_nest
description: "MiniAdımlar offline baby and pregnancy tracking app."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  fl_chart: ^1.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  firebase_data_connect: ^0.2.2+2
  cloud_firestore: ^6.3.0
  url_launcher: ^6.3.2
  firebase_messaging: ^16.2.0
  cloud_functions: ^6.2.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.7
  home_widget: ^0.9.1
  device_calendar: 4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2

dependency_overrides:
  timezone: ^0.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - lib/app/localization/tr.json
    - lib/app/localization/en.json

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
